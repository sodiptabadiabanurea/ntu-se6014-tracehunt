[project]
name = "tracehunt-mcp"
version = "0.1.0"
description = "TraceHunt MCP server: typed read-only ELK search tools with an evidence ledger (SE6014 M4)"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.2,<3",
    "elasticsearch>=9,<10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
tracehunt-mcp = "tracehunt_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tracehunt_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
